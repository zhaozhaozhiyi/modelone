<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/modelone-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17191D" />
  <meta name="description" content="modelOne 企业级 AI 开发与模型生产平台" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/modelone-mark.svg" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" data-modelone-app="frontend" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>modelOne｜企业级 AI 开发与模型生产平台</title>
  <script src="%PUBLIC_URL%/brand-config.js"></script>
  <script src="/myapp/brand.js"></script>
  <style>
    .mo-boot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: #f5f6f7;
    }

    .loading-star {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: contain;
      animation: aniStar 1.6s infinite ease-in-out;
    }

    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes aniStar {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div class="mo-boot">
      <img class="loading-star" src="%PUBLIC_URL%/modelone-mark.svg" width="48" height="48" alt="modelOne">
    </div>
  </div>

</html>
