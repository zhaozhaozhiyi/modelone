name: modelOne release checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.15'
      - run: python -m pip install 'SQLAlchemy>=1.4,<3' PyYAML alembic 'PyJWT>=2.8,<3'
      - run: python scripts/test_modelone.py
      - run: python scripts/test_modelone_auth.py
      - run: python scripts/test_modelone_notebook.py
      - run: python scripts/test_modelone_nodes.py
      - run: python scripts/test_modelone_resources.py
      - run: python scripts/test_modelone_image_bundle.py
      - run: python scripts/test_modelone_manifests.py
      - run: python scripts/brand_scan.py
      - name: Build all product frontends
        # Upstream lint warnings remain visible; brand and source-map gates
        # below still fail independently. CRA otherwise fails on every warning.
        env:
          CI: 'false'
        run: |
          for app in frontend vision visionPlus; do
            npm ci --prefix "myapp/$app" --legacy-peer-deps --no-audit --no-fund
            npm run build --prefix "myapp/$app"
          done
      - run: python scripts/brand_scan.py --built
      - name: Build and exercise the frontend delivery image
        run: |
          docker build --pull=false \
            --build-arg MODELONE_NGINX_IMAGE=nginx:stable \
            --tag modelone/ci-frontend \
            --file install/docker/dockerFrontend/Dockerfile .
          python scripts/test_modelone_frontend_image.py \
            --image modelone/ci-frontend \
            --report dist/modelone/ci-frontend-image-validation.json
      - name: Exercise real offline image save and load
        env:
          MODELONE_BUNDLE_TEST_IMAGE: modelone/ci-frontend
        run: python scripts/test_modelone_image_bundle.py
      - name: Render and scan enterprise deployment artifacts
        env:
          MODELONE_IMAGE_REGISTRY: registry.example.test/team
          MODELONE_ASSET_BASE_URL: https://assets.example.test/modelone
          MODELONE_COPYRIGHT_HOLDER: Validation Company
          MODELONE_HELP_URL: https://help.example.test/modelone
          MODELONE_SUPPORT_URL: https://support.example.test/modelone
          MODELONE_TERMS_URL: https://www.example.test/modelone/terms
          MODELONE_PRIVACY_URL: https://www.example.test/modelone/privacy
          MODELONE_PUBLIC_DOMAIN: modelone.example.test
          MODELONE_TLS_SECRET_NAME: modelone-tls
        run: |
          python install/kubernetes/all_image.py \
            --manifest-root install/kubernetes \
            --output dist/modelone/ci-images
          python scripts/render_deployment.py \
            --release \
            --image-plan dist/modelone/ci-images/images.json \
            --output dist/modelone/ci-release
          python scripts/brand_scan.py --artifact dist/modelone/ci-release
          python scripts/rewrite_deployment_images.py \
            --plan dist/modelone/ci-images/images.json \
            --output-dir dist/modelone/ci-manifests \
            --source-root install/kubernetes
          python scripts/brand_scan.py --artifact dist/modelone/ci-manifests
          python - <<'PY'
          import yaml
          from pathlib import Path

          gateway = [doc for doc in yaml.safe_load_all(Path('dist/modelone/ci-manifests/gateway.yaml').read_text()) if doc]
          virtual = [doc for doc in yaml.safe_load_all(Path('dist/modelone/ci-manifests/virtual.yaml').read_text()) if doc]
          ingress = [doc for doc in yaml.safe_load_all(Path('dist/modelone/ci-manifests/ingress.yaml').read_text()) if doc]
          assert any(
              server.get('port', {}).get('number') == 443
              and server.get('tls', {}).get('credentialName') == 'modelone-tls'
              for doc in gateway for server in doc.get('spec', {}).get('servers', [])
          )
          assert all(
              host == 'modelone.example.test'
              for doc in gateway for server in doc.get('spec', {}).get('servers', [])
              for host in server.get('hosts', [])
          )
          assert all(
              host == 'modelone.example.test'
              for doc in virtual for host in doc.get('spec', {}).get('hosts', [])
          )
          assert all(doc.get('apiVersion') == 'networking.k8s.io/v1' for doc in ingress)
          assert all(
              rule.get('host') == 'modelone.example.test'
              for doc in ingress for rule in doc.get('spec', {}).get('rules', [])
          )
          assert all(
              doc.get('spec', {}).get('tls') == [
                  {'hosts': ['modelone.example.test'], 'secretName': 'modelone-tls'}
              ]
              for doc in ingress
          )
          PY
      - name: Generate migration and compliance evidence
        run: |
          mkdir -p dist/modelone/ci-evidence
          python scripts/resource_inventory.py \
            --output dist/modelone/ci-evidence/resource-inventory.json
          python scripts/compliance_inventory.py
          python - <<'PY'
          import json
          from pathlib import Path

          resources = json.loads(Path('dist/modelone/ci-evidence/resource-inventory.json').read_text())
          dependencies = json.loads(Path('dist/modelone/compliance/dependencies.json').read_text())
          sbom = json.loads(Path('dist/modelone/compliance/frontend-sbom.cdx.json').read_text())
          assert len(resources) >= 1 and {row['kind'] for row in resources} == {'asset', 'image'}
          assert len(dependencies) >= 1
          assert all('reviewRequired' in row for row in dependencies)
          assert sbom['bomFormat'] == 'CycloneDX' and sbom['specVersion'] == '1.5'
          assert len(sbom['components']) >= 1
          PY
      - name: Upload migration and compliance evidence
        uses: actions/upload-artifact@v4
        with:
          name: modelone-migration-compliance-evidence
          path: |
            dist/modelone/ci-evidence/resource-inventory.json
            dist/modelone/compliance
      - run: git diff --check
