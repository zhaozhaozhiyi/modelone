apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

labels:
- pairs:
    app.kubernetes.io/name: modelone
    app.kubernetes.io/part-of: modelone
  includeSelectors: false
  includeTemplates: true

configMapGenerator:
- name: kubeflow-dashboard-config
  files:
  - config/config.py
  - config/entrypoint.sh
  - config/project.py
# kubectl delete configmap kubeflow-dashboard-config -n infra
# kubectl create configmap kubeflow-dashboard-config --from-file=config -n infra

- name: deploy-config
  literals:
  - STAGE=prod
  - REDIS_HOST=redis-master.infra
  - REDIS_PORT=6379
  - REDIS_PASSWORD=admin
  - MYSQL_SERVICE=mysql+pymysql://root:admin@mysql-service.infra:3306/kubeflow?charset=utf8
  - ENVIRONMENT=DEV
  # Enterprise overrides are generated by scripts/render_deployment.py.


vars:
- name: STAGE
  objref:
    kind: ConfigMap
    name: deploy-config
    apiVersion: v1
  fieldref:
    fieldpath: data.STAGE

resources:
  - ../base

images:
- name: modelone/kubeflow-dashboard
  newName: modelone/kubeflow-dashboard
  newTag: 2026.06.01
- name: modelone/kubeflow-dashboard-frontend
  newName: modelone/kubeflow-dashboard-frontend
  newTag: 2026.06.01


# kustomize build . | kubectl apply -f -


