services:
  redis:
    image: ${MODELONE_IMAGE_PREFIX:-}modelone/redis:7.4
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Provide the private Redis password}

  mysql:  # 数据库
    image: mysql:8.0.32
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MODELONE_MYSQL_ROOT_PASSWORD:?Provide the private database root password}
      MYSQL_USER: ${MODELONE_MYSQL_USER:-modelone}
      MYSQL_PASSWORD: ${MODELONE_MYSQL_PASSWORD:?Provide the private application database password}
      MYSQL_DATABASE: kubeflow
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker-add-file/mysqld.cnf:/etc/mysql/conf.d/mysqld.cnf
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --silent --execute="SELECT 1"']
      timeout: 45s
      interval: 10s
      retries: 10

  frontend:   # 前端容器
    image: ${MODELONE_IMAGE_PREFIX:-}modelone/kubeflow-dashboard-frontend:2026.06.01
    restart: unless-stopped
    command: ['sh','-c','nginx -g "daemon off;"']
    ports:
      - '${MODELONE_HTTP_BIND:-127.0.0.1}:${MODELONE_HTTP_PORT:-8080}:80'
    depends_on:
      myapp:
        condition: service_started
    volumes:
      - ../../myapp/static/appbuilder/frontend:/data/web/frontend
      - ../../myapp/static:/data/web/static
      - ../../install/docker/dockerFrontend/nginx.conf:/etc/nginx/nginx.conf
      - ../../install/docker/dockerFrontend/nginx.80.conf:/etc/nginx/conf.d/default.conf

  myapp:   # 后端容器
    image: ${MODELONE_IMAGE_PREFIX:-}modelone/kubeflow-dashboard:2026.06.01
    restart: unless-stopped
    command: ['bash', '/entrypoint.sh']
    environment:
      STAGE: ${MODELONE_STAGE:-prod}
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Provide the private Redis password}
      MYSQL_SERVICE: ${MYSQL_SERVICE:?Provide the private application database URL}
      ENVIRONMENT: DEV
      MODELONE_SECRET_KEY: ${MODELONE_SECRET_KEY:?Create a private secrets env file first}
      MODELONE_JWT_KEY: ${MODELONE_JWT_KEY:?Create a private secrets env file first}
      MODELONE_ADMIN_PASSWORD: ${MODELONE_ADMIN_PASSWORD:-}
      MODELONE_COOKIE_SECURE: ${MODELONE_COOKIE_SECURE:-true}
      MODELONE_WEB_WORKERS: ${MODELONE_WEB_WORKERS:-4}
      MODELONE_TRUSTED_PROXY_IPS: ${MODELONE_TRUSTED_PROXY_IPS:-127.0.0.1}
    depends_on:
        redis:
          condition: service_started
        mysql:
          condition: service_healthy
    volumes:
      - ../../myapp/static/appbuilder/frontend:/data/web/frontend
      - ../../myapp/:/home/myapp/myapp/
      - ../../config/modelone.json:/home/myapp/config/modelone.json:ro
      - ../../aihub/:/cube-studio/aihub/
      - ../../job-template/:/cube-studio/job-template/
      - ./file:/data/k8s/kubeflow
      - ./entrypoint.sh:/entrypoint.sh
      - ./config.py:/home/myapp/myapp/config.py
      - ./project.py:/home/myapp/myapp/project.py
      - ./kubeconfig:/home/myapp/kubeconfig
