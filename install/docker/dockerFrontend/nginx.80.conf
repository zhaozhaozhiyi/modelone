server {
    listen       80;
    server_name  _;
    # Preserve the public scheme when TLS terminates at an upstream gateway.
    absolute_redirect off;
    access_log  /data/log/nginx/access.log  main;
    error_log   /data/log/nginx/error.log;

    # Local proxy failures must remain readable when the backend is unavailable.
    # Keep upstream API/HTML errors intact (proxy_intercept_errors stays off).
    error_page 500 /static/modelone-errors/500.html;
    error_page 502 /static/modelone-errors/502.html;
    error_page 503 /static/modelone-errors/503.html;
    error_page 504 /static/modelone-errors/504.html;
    location ^~ /static/modelone-errors/ {
        internal;
        root /data/web;
        add_header Cache-Control "no-store" always;
    }
    location /static/assets/modelone/ {
        root /data/web;
        try_files $uri =404;
    }

    # Source maps are never served by a product deployment.
    location ~* \.map$ {
        return 404;
    }

    location = / {
        return 301 /frontend/;
    }

    # 静态资源
    location /frontend/ {
        autoindex off; # 禁止目录遍历
        root   /data/web;
        index  index.html index.htm;
        try_files $uri $uri/ /frontend/index.html;
        if ($request_filename ~* .*\.html$) {
          add_header Cache-Control "no-cache, no-store";
        }
    }

    # 静态资源
    location /static/appbuilder/ {
        autoindex off; # 禁止目录遍历
        root   /data/web;
        index  index.html index.htm;
        try_files $uri $uri/ /frontend/index.html;
        if ($request_filename ~* .*\.html$) {
          add_header Cache-Control "no-cache, no-store";
        }
    }

    location / {
        autoindex off; # 禁止目录遍历

        # 线上生产使用
        # proxy_pass http://kubeflow-dashboard.infra/;
        # 本地调试使用
        proxy_pass http://myapp:80/;

        proxy_http_version 1.1;
        # 连接延时
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # IP 穿透
        # proxy_set_header Host   $proxy_host;
        proxy_set_header Host       $http_host;
        # proxy_set_header Host       $host;
        # proxy_set_header Host       $host:$proxy_port;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 穿透
        # Preserve browser origin for backend login and WebSocket checks.
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

    }

}
