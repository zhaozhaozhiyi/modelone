server {
    listen 80;
    server_name _;
    absolute_redirect off;
    location = / {
        return 302 /labelstudio/;
    }
    location = /labelstudio {
        return 302 /labelstudio/;
    }
    location = /labelstudio/modelone-compact.css {
        alias /etc/nginx/modelone-integrations/compact.css;
        default_type text/css;
        add_header Cache-Control "no-store";
    }
    location = /labelstudio/modelone-zh.js {
        alias /etc/nginx/modelone-integrations/locale-zh.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
    location /labelstudio/ {
        proxy_pass http://label-studio:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_path / /labelstudio/;
        proxy_set_header Accept-Encoding '';
        sub_filter '</head>' '<link rel="stylesheet" href="/labelstudio/modelone-compact.css"><script src="/labelstudio/modelone-zh.js"></script></head>';
        sub_filter_once on;
        proxy_read_timeout 300s;
        client_max_body_size 256m;
    }
}
