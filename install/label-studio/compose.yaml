name: modelone-label-studio
services:
  label-studio-db:
    image: ${MODELONE_LABEL_STUDIO_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: labelstudio
      POSTGRES_USER: labelstudio
      POSTGRES_PASSWORD: ${LABEL_STUDIO_DB_PASSWORD:?Generate private Label Studio settings first}
    volumes:
      - label-studio-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U labelstudio -d labelstudio']
      interval: 10s
      timeout: 5s
      retries: 12

  label-studio:
    image: ${MODELONE_LABEL_STUDIO_IMAGE:-heartexlabs/label-studio:1.23.2}
    restart: unless-stopped
    depends_on:
      label-studio-db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.modelone
      MODELONE_LABEL_STUDIO_SSO_SECRET: ${LABEL_STUDIO_SSO_SECRET:?Generate private Label Studio settings first}
      DJANGO_DB: postgresql
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: labelstudio
      POSTGRE_PASSWORD: ${LABEL_STUDIO_DB_PASSWORD:?Generate private Label Studio settings first}
      POSTGRE_HOST: label-studio-db
      POSTGRE_PORT: '5432'
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:?Set the public URL ending in /labelstudio}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_ADMIN_EMAIL:?Set the initial administrator email}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_ADMIN_PASSWORD:?Generate private Label Studio settings first}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: 'true'
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: 'false'
      LABEL_STUDIO_COLLECT_ANALYTICS: 'false'
      LABEL_STUDIO_SENTRY_DSN: ''
      LABEL_STUDIO_FRONTEND_SENTRY_DSN: ''
      LABEL_STUDIO_SESSION_COOKIE_SECURE: ${LABEL_STUDIO_COOKIE_SECURE:-1}
      LABEL_STUDIO_CSRF_COOKIE_SECURE: ${LABEL_STUDIO_COOKIE_SECURE:-1}
    volumes:
      - label-studio-data:/label-studio/data
      - ../../integrations/label-studio/modelone_settings.py:/label-studio/label_studio/core/settings/modelone.py:ro
      - ../../integrations/label-studio/modelone_sso.py:/label-studio/label_studio/modelone_sso.py:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/health >/dev/null']
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 12

  label-studio-gateway:
    image: ${MODELONE_LABEL_STUDIO_NGINX_IMAGE:-nginx:stable}
    restart: unless-stopped
    depends_on:
      label-studio:
        condition: service_healthy
    ports:
      - '127.0.0.1:${MODELONE_LABEL_STUDIO_PORT:-8086}:80'
    volumes:
      - ./nginx-standalone.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../integrations/label-studio:/etc/nginx/modelone-integrations:ro

volumes:
  label-studio-data: {}
  label-studio-db: {}
