# This file is mounted only when the integration is enabled.
location = /labelstudio {
    return 302 /labelstudio/projects;
}

location = /labelstudio/ {
    return 302 /labelstudio/projects;
}

location = /labelstudio/modelone-compact.css {
    alias /etc/nginx/modelone-integrations/compact.css;
    default_type text/css;
    add_header Cache-Control "no-store";
}

location = /labelstudio/modelone-zh.js {
    alias /etc/nginx/modelone-integrations/locale-zh.js;
    default_type application/javascript;
    add_header Cache-Control "no-store";
}

# These standalone product routes are intentionally outside the embedded
# modelOne workflow. Keep old bookmarks from exposing product administration
# and version pages.
location = /labelstudio/organization {
    return 302 /labelstudio/projects;
}

location = /labelstudio/version {
    return 302 /labelstudio/projects;
}

location ^~ /labelstudio/ {
    auth_request /_modelone_label_studio_access;
    auth_request_set $modelone_label_assertion $upstream_http_x_modelone_assertion;
    # Defer resolution so a restarting optional service cannot stop the gateway.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $label_studio_upstream label-studio:8080;
    # Strip the public prefix before forwarding to Label Studio.
    rewrite ^/labelstudio/(.*)$ /$1 break;
    proxy_pass http://$label_studio_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Modelone-Assertion $modelone_label_assertion;
    proxy_set_header Authorization '';
    # Inject the compact embedded UI stylesheet into HTML only. The upstream
    # response must be uncompressed for nginx sub_filter to see </head>.
    proxy_set_header Accept-Encoding '';
    sub_filter '</head>' '<link rel="stylesheet" href="/labelstudio/modelone-compact.css"><script src="/labelstudio/modelone-zh.js"></script></head>';
    sub_filter_once on;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 256m;
    # Keep Django cookies scoped away from platform routes.
    proxy_cookie_path / /labelstudio/;
}

location = /_modelone_label_studio_access {
    internal;
    proxy_pass http://myapp:80/label_studio/api/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length '';
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $http_host;
    # Browser access requires a platform session, never a user-controlled header.
    proxy_set_header Authorization '';
}
